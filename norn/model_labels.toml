# norn/model_labels.toml — the ONE home for every model id and reasoning
# effort norn sends to a provider. Pipelines, stages, knobs and step
# front-matter name a label; nothing outside this file names a model id.
#
# To adopt a new model: change `model` (and `effort`) here, set `since`,
# run the unit suite, run `norn models`. Do not touch a pipeline.
version = 1

[claude-code.light]      # cheap, fast: briefs, judging, log compression
model  = "claude-haiku-4-5-20251001"
effort = "low"
since  = "2026-09-07"
context_window = 200000

[claude-code.standard]   # implementation steps, reviews, aggregate repair, CI fixes
model  = "claude-sonnet-5"
effort = "high"
since  = "2026-09-08"
context_window = 1000000

[claude-code.deep]       # plan drafting, hard bugs, steps that ask for it
model  = "claude-opus-5"
effort = "xhigh"
since  = "2026-09-08"
context_window = 1000000

[codex.review]           # plan review in plan_with_review / fix_jira_issue
model  = "gpt-5.6-sol"
effort = "high"          # mirrors ~/.codex/config.toml on the dev machine today
since  = "2026-09-07"

[opencode.light]
model  = "github-copilot/claude-sonnet-4.6"
since  = "2026-09-07"

[opencode.standard]
model  = "github-copilot/claude-sonnet-4.6"
since  = "2026-09-07"

[opencode.deep]
model  = "github-copilot/claude-opus-4.7"
since  = "2026-09-07"
